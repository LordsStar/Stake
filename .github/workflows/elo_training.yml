name: Resultados y entrenamiento Elo Blindado

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      full_backfill:
        description: "Repetir backfill histórico principal"
        required: false
        type: boolean
        default: false
      max_leagues:
        description: "Ligas TheSportsDB a procesar en esta corrida (0=todas)"
        required: false
        default: "24"

permissions:
  contents: write

concurrency:
  group: blindado-state-writer
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Dependencias
        run: pip install requests

      - name: Actualizar rama
        run: git pull --rebase origin main

      - name: Resultados, alias y Elo
        env:
          FULL_BACKFILL: ${{ inputs.full_backfill || 'false' }}
          MAX_LEAGUES: ${{ inputs.max_leagues || '24' }}
        run: |
          EXTRA_ARGS=""
          if [ "$FULL_BACKFILL" = "true" ]; then EXTRA_ARGS="--full-backfill"; fi
          python results_pipeline.py --max-leagues "$MAX_LEAGUES" $EXTRA_ARGS

      - name: Guardar estado público
        run: |
          git config user.name "blindado-bot"
          git config user.email "blindado-bot@users.noreply.github.com"
          git add state/results/results.json state/elo_state.json \
            state/source_coverage.json state/result_source_state.json \
            state/results_pipeline_state.json state/auto_team_aliases.json \
            state/unresolved_aliases.json
          git diff --cached --quiet || git commit -m "Actualiza resultados, alias y Elo"
          git pull --rebase origin main
          git push
